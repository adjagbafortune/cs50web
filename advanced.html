<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Advanced Search</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="nav-links">
            <a href="index.html">Google Search</a>
        </div>

        <div class="header-advanced-title">
            <h1>Advanced Search</h1>
        </div>

        <form action="https://www.google.com/search">
            
            <div class="search-criteria-section">
                <div class="section-title">
                    Find pages with...
                </div>
                <div class="form-group">
                    <label for="as_q">all these words :</label>
                    <input type="text" name="as_q" id="as_q">
                </div>
                <div class="form-group">
                    <label for="as_epq">this exact word or phrase :</label>
                    <input type="text" name="as_epq" id="as_epq">
                </div>
                <div class="form-group">
                    <label for="as_oq">any of these words :</label>
                    <input type="text" name="as_oq" id="as_oq">
                </div>
                <div class="form-group">
                    <label for="as_eq">none of these words :</label>
                    <input type="text" name="as_eq" id="as_eq">
                </div>
            </div>
            
            <div class="submit-button-container">
                <input type="submit" value="Advanced Search" class="advanced-submit-button">
            </div>

        </form>
    </body>
</html>
