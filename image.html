<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Image Search</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="nav-links">
            <a href="index.html">Google Search</a>
        </div>
        
        <div class="search-wrapper-image">
            
            <div class="header-image-mode">
                <div class="logo-placeholder logo-small">
                    <span class="g-color-blue">G</span>
                    <span class="o-color-red">o</span>
                    <span class="o-color-yellow">o</span>
                    <span class="g-color-blue">g</span>
                    <span class="l-color-green">l</span>
                    <span class="e-color-red">e</span>
                </div>
                <span class="mode-text">images</span>
            </div>
            
            <form action="https://www.google.com/search">

                <input type="text" name="q" class="search-input-image">

                <input type="hidden" name="tbm" value="isch">

                <div class="buttons-container-image">
                    <input type="submit" value="Image Search">
                </div>
            </form>
        </div>
    </body>
</html>
